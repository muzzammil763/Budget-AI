<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your Budget AI account</title>
  </head>
  <body style="margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                 style="max-width:520px;background:#fff;border:1px solid #ddd;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 8px;color:#2563eb;font-size:12px;font-weight:700;letter-spacing:1.4px">
                  BUDGET AI
                </p>
                <h1 style="margin:0 0 16px;font-size:26px">Confirm your email</h1>
                <p style="margin:0 0 24px;line-height:1.6">
                  Confirm this email address to finish creating your secure
                  Budget AI account.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:13px 20px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700">
                    Confirm email
                  </a>
                </p>
                <p style="margin:0 0 8px;line-height:1.6">
                  If the button does not open the app, enter this one-time code:
                </p>
                <p style="margin:0 0 24px;font-size:26px;font-weight:700;letter-spacing:5px">
                  {{ .Token }}
                </p>
                <p style="margin:0;color:#666;font-size:13px;line-height:1.5">
                  If you did not create this account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
