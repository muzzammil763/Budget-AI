name: budget_ai
description: "Budget AI - Personal Finance Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  crypto: ^3.0.7
  gpt_markdown: ^1.1.7
  toastification: ^3.2.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  path: ^1.9.1
  sqflite: ^2.4.3
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  flutter_local_notifications: ^22.0.1
  app_settings: ^7.0.0
  permission_handler: ^12.0.3
  local_auth: ^3.0.1
  flutter_syntax_view: ^4.1.7
  uuid: ^4.5.3
  auto_size_text: ^3.0.0
  record: ^7.1.1
  home_widget: ^0.9.3
  share_plus: ^13.2.0
  file_picker: ^12.0.0-beta.7
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf

    - family: Boldonse
      fonts:
        - asset: assets/fonts/Boldonse.ttf
