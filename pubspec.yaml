name: budget_ai
description: "Budget AI - Personal Finance Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  gpt_markdown: ^1.1.7
  toastification: ^3.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.3
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  flutter_local_notifications: ^22.0.1
  app_settings: ^7.0.0
  permission_handler: ^12.0.3
  local_auth: ^3.0.1
  flutter_syntax_view: ^4.1.7
  lottie: ^3.4.0
  uuid: ^4.5.3
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  file_picker: ^12.0.0-beta.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lotties/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
